<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caroline Clock</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            background: transparent;
        }

        .clock {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 4%;
        }

        .time-box {
            width: 38%;
            aspect-ratio: 0.78 / 1;

            background-color: #F7CACB;

            border-radius: 18px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* DIGITALA SIFFROR */

        .digit {
            position: relative;

            width: 48%;
            height: 70%;

            display: block;
        }


        /* Alla segment */

        .segment {
            position: absolute;

            background-color: #FFFFFF;

            border-radius: 4px;

            opacity: 0;
        }


        /* Vågräta segment */

        .a,
        .g,
        .d {
            left: 12%;
            width: 76%;
            height: 10%;
        }

        .a {
            top: 0;
        }

        .g {
            top: 45%;
        }

        .d {
            bottom: 0;
        }


        /* Lodräta segment */

        .f,
        .b,
        .e,
        .c {
            width: 10%;
            height: 38%;
        }

        .f {
            left: 0;
            top: 6%;
        }

        .b {
            right: 0;
            top: 6%;
        }

        .e {
            left: 0;
            bottom: 6%;
        }

        .c {
            right: 0;
            bottom: 6%;
        }


        /* Aktiva segment */

        .on {
            opacity: 1;
        }


        /* Strecket genom siffran */

        .middle-line {
            position: absolute;

            left: 8%;
            right: 8%;

            top: 49%;

            height: 2px;

            background-color: #FFFFFF;

            opacity: 0.8;
        }


        /* Mellanrum mellan timme och minut */

        .separator {
            width: 5%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 12px;
        }

        .separator-dot {
            width: 10px;
            height: 10px;

            background-color: #F7CACB;

            border-radius: 50%;
        }

    </style>
</head>

<body>

    <div class="clock">

        <!-- TIMMAR -->

        <div class="time-box">

            <div class="digit" id="hour1">

                <div class="segment a"></div>
                <div class="segment b"></div>
                <div class="segment c"></div>
                <div class="segment d"></div>
                <div class="segment e"></div>
                <div class="segment f"></div>
                <div class="segment g"></div>

                <div class="middle-line"></div>

            </div>

        </div>


        <!-- SEPARATOR -->

        <div class="separator">

            <div class="separator-dot"></div>
            <div class="separator-dot"></div>

        </div>


        <!-- MINUTER -->

        <div class="time-box">

            <div class="digit" id="minute1">

                <div class="segment a"></div>
                <div class="segment b"></div>
                <div class="segment c"></div>
                <div class="segment d"></div>
                <div class="segment e"></div>
                <div class="segment f"></div>
                <div class="segment g"></div>

                <div class="middle-line"></div>

            </div>

        </div>

    </div>


    <script>

        const numbers = {

            "0": ["a", "b", "c", "d", "e", "f"],
            "1": ["b", "c"],
            "2": ["a", "b", "g", "e", "d"],
            "3": ["a", "b", "g", "c", "d"],
            "4": ["f", "g", "b", "c"],
            "5": ["a", "f", "g", "c", "d"],
            "6": ["a", "f", "g", "e", "c", "d"],
            "7": ["a", "b", "c"],
            "8": ["a", "b", "c", "d", "e", "f", "g"],
            "9": ["a", "b", "c", "d", "f", "g"]

        };


        function showDigit(element, number) {

            const segments = element.querySelectorAll(".segment");

            segments.forEach(segment => {
                segment.classList.remove("on");
            });


            numbers[number].forEach(segmentName => {

                const segment =
                    element.querySelector("." + segmentName);

                segment.classList.add("on");

            });

        }


        function updateClock() {

            const now = new Date();

            const hours =
                String(now.getHours()).padStart(2, "0");

            const minutes =
                String(now.getMinutes()).padStart(2, "0");


            showDigit(
                document.getElementById("hour1"),
                hours[0]
            );


            showDigit(
                document.getElementById("minute1"),
                minutes[0]
            );

        }


        updateClock();

        setInterval(updateClock, 1000);

    </script>

</body>
</html>
