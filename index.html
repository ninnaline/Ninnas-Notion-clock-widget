<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caroline Clock</title>

    <style>

        /* =========================================
           FÄRGER
           Ändra bara dessa fyra värden om du
           senare vill byta färger på klockan.
           ========================================= */

        :root {
            --box-color: #F7CACB;
            --number-color: #FFFFFF;
            --line-color: #FFFFFF;
            --colon-color: #F7CACB;
        }


        /* =========================================
           GRUNDINSTÄLLNINGAR
           ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================================
           HELA KLOCKAN
           ========================================= */

        .clock {
            width: 96%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3%;
        }


        /* =========================================
           DE TVÅ BOXARNA
           ========================================= */

        .time-box {
            position: relative;

            width: 44%;
            aspect-ratio: 0.88 / 1;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: var(--box-color);

            border-radius: clamp(12px, 3vw, 28px);

            overflow: hidden;
        }


        /* =========================================
           SIFFRORNA
           ========================================= */

        .time-number {
            position: relative;
            z-index: 1;

            color: var(--number-color);

            font-family:
                "Arial Narrow",
                "Roboto Condensed",
                "Helvetica Neue",
                Arial,
                sans-serif;

            font-size: clamp(70px, 30vw, 300px);
            font-weight: 700;

            line-height: 0.8;

            letter-spacing: -0.06em;

            white-space: nowrap;

            transform: scaleX(0.82);
        }


        /* =========================================
           FLIP-STRECKET

           Detta går från kant till kant genom
           mitten av boxen och siffrorna.
           ========================================= */

        .flip-line {
            position: absolute;

            left: 0;
            top: 50%;

            width: 100%;
            height: clamp(1px, 0.35vw, 3px);

            transform: translateY(-50%);

            background-color: var(--line-color);

            z-index: 2;

            pointer-events: none;
        }


        /* =========================================
           KOLONET
           ========================================= */

        .colon {
            width: 5%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: clamp(12px, 4vw, 32px);

            flex-shrink: 0;
        }

        .colon-dot {
            width: clamp(7px, 2.2vw, 18px);
            aspect-ratio: 1 / 1;

            background-color: var(--colon-color);

            border-radius: 50%;
        }

    </style>
</head>


<body>

    <div class="clock">

        <!-- TIMMAR -->

        <div class="time-box">

            <div
                class="time-number"
                id="hours">
                00
            </div>

            <div class="flip-line"></div>

        </div>


        <!-- KOLON -->

        <div class="colon">

            <div class="colon-dot"></div>

            <div class="colon-dot"></div>

        </div>


        <!-- MINUTER -->

        <div class="time-box">

            <div
                class="time-number"
                id="minutes">
                00
            </div>

            <div class="flip-line"></div>

        </div>

    </div>


    <script>

        function updateClock() {

            const now = new Date();

            const hours =
                String(now.getHours()).padStart(2, "0");

            const minutes =
                String(now.getMinutes()).padStart(2, "0");


            document.getElementById("hours").textContent =
                hours;

            document.getElementById("minutes").textContent =
                minutes;
        }


        // Visa rätt tid direkt
        updateClock();


        // Kontrollera tiden varje sekund
        setInterval(updateClock, 1000);

    </script>

</body>
</html>
