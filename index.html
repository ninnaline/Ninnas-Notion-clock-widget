<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caroline Clock</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: transparent;
        }

        .clock {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 4%;
        }

        .time-box {
            width: 38%;
            aspect-ratio: 0.78 / 1;

            background-color: #F7CACB;
            color: #FFFFFF;

            border-radius: 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: clamp(36px, 8vw, 80px);
            font-weight: bold;
            line-height: 1;
        }

    </style>
</head>

<body>

    <div class="clock">

        <div class="time-box" id="hours">00</div>

        <div class="time-box" id="minutes">00</div>

    </div>


    <script>

        function updateClock() {

            const now = new Date();

            const hours = String(now.getHours()).padStart(2, '0');

            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('hours').textContent = hours;

            document.getElementById('minutes').textContent = minutes;
        }


        // Uppdatera direkt när sidan öppnas
        updateClock();


        // Kontrollera tiden varje sekund
        setInterval(updateClock, 1000);

    </script>

</body>
</html>
